<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel el Gordito 💨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Fredoka+One&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    width: 400px;
    height: 600px;
  }

  canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 0 60px rgba(255,120,50,0.4), 0 0 120px rgba(255,80,0,0.15);
  }

  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* MENU */
  #menuScreen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #ff6b35 0%, #f7931e 40%, #ffcd3c 100%);
    border-radius: 16px;
    pointer-events: all;
  }

  .title-wobble {
    font-family: 'Boogaloo', cursive;
    font-size: 52px;
    color: #fff;
    text-shadow: 4px 4px 0 #c0392b, 6px 6px 0 rgba(0,0,0,0.3);
    text-align: center;
    line-height: 1.1;
    animation: wobble 1.5s ease-in-out infinite;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 22px;
    color: #fff3;
    margin-bottom: 30px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
  }

  .daniel-preview {
    font-size: 80px;
    animation: float 2s ease-in-out infinite;
    margin-bottom: 20px;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
  }

  .highscore-box {
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 10px 30px;
    margin-bottom: 28px;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .highscore-label { color: #ffe; font-size: 14px; opacity: 0.8; }
  .highscore-val { color: #ffcd3c; font-size: 36px; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }

  .btn-start {
    background: #c0392b;
    color: white;
    border: none;
    padding: 16px 48px;
    font-size: 26px;
    font-family: 'Fredoka One', cursive;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #922b21, 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }
  .btn-start:hover { transform: translateY(2px); box-shadow: 0 4px 0 #922b21, 0 6px 16px rgba(0,0,0,0.3); }
  .btn-start:active { transform: translateY(5px); box-shadow: 0 1px 0 #922b21; }

  .hint { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 14px; }

  /* GAME OVER */
  #gameOverScreen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    border-radius: 16px;
    pointer-events: all;
    backdrop-filter: blur(4px);
  }

  .go-title {
    font-family: 'Boogaloo', cursive;
    font-size: 64px;
    color: #e74c3c;
    text-shadow: 3px 3px 0 #000;
    animation: shake 0.5s ease-in-out;
  }

  .score-panel {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 20px 40px;
    margin: 20px 0;
    text-align: center;
    width: 280px;
  }

  .score-row { display: flex; justify-content: space-between; margin: 8px 0; }
  .score-row .lbl { color: rgba(255,255,255,0.6); font-size: 18px; }
  .score-row .val { color: #ffcd3c; font-size: 24px; }

  /* WIN */
  #winScreen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%);
    border-radius: 16px;
    pointer-events: all;
    text-align: center;
    padding: 20px;
  }

  .win-trophy { font-size: 80px; animation: bounce 0.8s ease-in-out infinite alternate; }

  .win-title {
    font-family: 'Boogaloo', cursive;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    margin: 12px 0 8px;
    line-height: 1.2;
  }

  .win-subtitle { font-size: 48px; margin: 10px 0; }

  .win-score {
    font-size: 22px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 20px;
  }

  /* HUD */
  #hud {
    position: absolute; top: 14px; left: 0;
    width: 100%;
    display: none;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 18px;
    pointer-events: none;
  }

  .hud-score {
    font-family: 'Boogaloo', cursive;
    font-size: 48px;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.3);
  }

  .phase-badge {
    background: rgba(0,0,0,0.4);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    margin-top: 8px;
  }

  @keyframes wobble {
    0%,100% { transform: rotate(-2deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.04); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-14px) scale(1.08); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-score" id="scoreDisplay">0</div>
    <div class="phase-badge" id="phaseBadge">Fase 1: Habitación</div>
  </div>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="daniel-preview">🧍‍♂️</div>
    <div class="title-wobble">Daniel<br>el Gordito</div>
    <div class="subtitle">💨 Powered by Farts 💨</div>
    <div class="highscore-box">
      <div class="highscore-label">🏆 RÉCORD MÁXIMO</div>
      <div class="highscore-val" id="menuHighScore">0</div>
    </div>
    <button class="btn-start" id="btnStart">▶ JUGAR</button>
    <div class="hint">Clic o ESPACIO para saltar</div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen">
    <div class="go-title">💀 GAME OVER</div>
    <div style="font-size:50px; margin:10px 0;">😵</div>
    <div class="score-panel">
      <div class="score-row"><span class="lbl">Puntuación</span><span class="val" id="goScore">0</span></div>
      <div class="score-row"><span class="lbl">🏆 Récord</span><span class="val" id="goHighScore">0</span></div>
    </div>
    <button class="btn-start" id="btnRetry">🔁 REINTENTAR</button>
    <button class="btn-start" style="background:#555;box-shadow:0 6px 0 #333;margin-top:10px;font-size:18px;padding:12px 30px;" id="btnGoMenu">🏠 MENÚ</button>
  </div>

  <!-- WIN -->
  <div id="winScreen">
    <div class="win-trophy">🏆</div>
    <div class="win-subtitle">🍔🍔🍔</div>
    <div class="win-title">¡Gracias por jugar a<br>Daniel el Gordito!</div>
    <div style="font-size:38px;margin:8px 0;">🎉😄🎊</div>
    <div class="win-score" id="winScore">Puntuación final: 50</div>
    <button class="btn-start" style="background:#c0392b;margin-top:10px;" id="btnWinMenu">🏠 MENÚ PRINCIPAL</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- STATE ---
let state = 'menu'; // menu | playing | gameover | win
let score = 0;
let highScore = parseInt(localStorage.getItem('danielHS') || '0');
let phase = 1;
let frameCount = 0;
let particles = [];
let stars = [];
let bgObjects = []; // phase background decorations

// --- DANIEL ---
const DANIEL = {
  x: 80, y: H/2,
  vy: 0,
  w: 44, h: 52,
  gravity: 0.45,
  jumpForce: -8.5,
  rotation: 0,
  fartClouds: []
};

// --- PIPES ---
const PIPE_W = 56;
const PIPE_GAP = 160;
let pipes = [];
let pipeSpeed = 2.2;
let pipeInterval = 110;
let pipeTimer = 0;

// --- PHASES config ---
const PHASES = [
  { id:1, name:'Habitación',       minScore:0,  maxScore:10, speed:2.2, interval:110, gap:160 },
  { id:2, name:'Baño',             minScore:10, maxScore:20, speed:2.7, interval:100, gap:155 },
  { id:3, name:'Jardín',           minScore:20, maxScore:30, speed:3.2, interval:95,  gap:148 },
  { id:4, name:'Carretera',        minScore:30, maxScore:40, speed:3.8, interval:90,  gap:142 },
  { id:5, name:'Local de Comida',  minScore:40, maxScore:50, speed:4.4, interval:85,  gap:136 },
];

// --- INIT STARS ---
for(let i=0;i<60;i++){
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+0.5, alpha: Math.random() });
}

// --- DOM ---
document.getElementById('menuHighScore').textContent = highScore;
document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnRetry').onclick = startGame;
document.getElementById('btnGoMenu').onclick = showMenu;
document.getElementById('btnWinMenu').onclick = showMenu;

document.addEventListener('keydown', e => {
  if(e.code === 'Space') { e.preventDefault(); handleJump(); }
});
canvas.addEventListener('click', handleJump);
document.getElementById('menuScreen').addEventListener('click', e => { if(e.target === document.getElementById('menuScreen')) startGame(); });

function handleJump(){
  if(state === 'playing'){
    DANIEL.vy = DANIEL.jumpForce;
    spawnFartCloud();
  }
}

function startGame(){
  score = 0;
  phase = 1;
  frameCount = 0;
  pipes = [];
  particles = [];
  bgObjects = [];
  pipeTimer = 0;

  DANIEL.y = H/2;
  DANIEL.vy = 0;
  DANIEL.rotation = 0;
  DANIEL.fartClouds = [];

  updatePhase();
  generateBgObjects();

  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('scoreDisplay').textContent = '0';

  state = 'playing';
  requestAnimationFrame(loop);
}

function showMenu(){
  state = 'menu';
  document.getElementById('menuScreen').style.display = 'flex';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('menuHighScore').textContent = highScore;
}

function showGameOver(){
  state = 'gameover';
  if(score > highScore){ highScore = score; localStorage.setItem('danielHS', highScore); }
  document.getElementById('gameOverScreen').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('goScore').textContent = score;
  document.getElementById('goHighScore').textContent = highScore;
}

function showWin(){
  state = 'win';
  if(score > highScore){ highScore = score; localStorage.setItem('danielHS', highScore); }
  document.getElementById('winScreen').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('winScore').textContent = 'Puntuación final: ' + score;
}

function updatePhase(){
  let p = PHASES.find(p => score >= p.minScore && score < p.maxScore) || PHASES[PHASES.length-1];
  if(p.id !== phase){
    phase = p.id;
    generateBgObjects();
  }
  pipeSpeed = p.speed;
  pipeInterval = p.interval;
  document.getElementById('phaseBadge').textContent = 'Fase '+p.id+': '+p.name;
  let ph = PHASES[phase-1];
  return ph;
}

// --- BACKGROUND OBJECTS per phase ---
function generateBgObjects(){
  bgObjects = [];
  if(phase===1){ // Habitación
    for(let i=0;i<3;i++) bgObjects.push({type:'window',x:80+i*130,y:60,w:60,h:70});
    for(let i=0;i<2;i++) bgObjects.push({type:'picture',x:50+i*200,y:150,w:50,h:40});
    bgObjects.push({type:'sofa',x:30,y:H-130,w:120,h:70});
    bgObjects.push({type:'tv',x:W-120,y:H-160,w:80,h:60});
  } else if(phase===2){ // Baño
    bgObjects.push({type:'toilet',x:30,y:H-130,w:55,h:80});
    bgObjects.push({type:'sink',x:W-90,y:H-120,w:70,h:60});
    bgObjects.push({type:'tiles',x:0,y:0,w:W,h:H});
    bgObjects.push({type:'mirror',x:W/2-30,y:50,w:60,h:80});
  } else if(phase===3){ // Jardín
    for(let i=0;i<5;i++) bgObjects.push({type:'tree',x:30+i*80,y:H-180,w:50,h:120});
    for(let i=0;i<8;i++) bgObjects.push({type:'bush',x:20+i*50,y:H-95,w:40,h:35});
    bgObjects.push({type:'sun',x:W-60,y:50,r:30});
    for(let i=0;i<4;i++) bgObjects.push({type:'cloud',x:30+i*100,y:30+i*20,w:70,h:30});
  } else if(phase===4){ // Carretera
    bgObjects.push({type:'road',x:0,y:H-80,w:W,h:80});
    for(let i=0;i<5;i++) bgObjects.push({type:'building',x:i*90,y:H-240-Math.random()*80,w:70,h:160+Math.random()*80});
    for(let i=0;i<3;i++) bgObjects.push({type:'car',x:50+i*130,y:H-60,w:80,h:30,color:['#e74c3c','#3498db','#f1c40f'][i]});
    for(let i=0;i<6;i++) bgObjects.push({type:'stripe',x:10+i*70,y:H-45,w:40,h:8});
  } else if(phase===5){ // Comida rápida
    bgObjects.push({type:'floor',x:0,y:H-80,w:W,h:80,color:'#8B4513'});
    bgObjects.push({type:'counter',x:0,y:H-130,w:W,h:50});
    for(let i=0;i<3;i++) bgObjects.push({type:'burger',x:40+i*130,y:H-190,size:30});
    for(let i=0;i<4;i++) bgObjects.push({type:'lamp',x:30+i*110,y:0,w:10,h:60});
    bgObjects.push({type:'sign',x:W/2-70,y:20,w:140,h:50,text:'🍔 FAST FOOD 🍔'});
  }
}

// --- FART CLOUDS ---
function spawnFartCloud(){
  DANIEL.fartClouds.push({x: DANIEL.x, y: DANIEL.y + DANIEL.h - 10, life: 1, vx: -1.5, vy: 1 });
}

// --- PARTICLES ---
function spawnScoreParticle(x, y){
  for(let i=0;i<6;i++){
    let angle = Math.random()*Math.PI*2;
    particles.push({ x, y, vx: Math.cos(angle)*3, vy: Math.sin(angle)*3-2, life:1, color:['#ffcd3c','#ff6b35','#fff'][Math.floor(Math.random()*3)] });
  }
}

// --- PIPE GENERATION ---
function spawnPipe(){
  let ph = PHASES[phase-1];
  let gap = ph ? ph.gap : 160;
  let topH = 80 + Math.random()*(H - gap - 160);
  pipes.push({ x: W+10, topH, bottomY: topH + gap, scored: false });
}

// --- COLLISION ---
function checkCollision(){
  let dx = DANIEL.x, dy = DANIEL.y, dw = DANIEL.w, dh = DANIEL.h;
  let margin = 8;
  // floor/ceiling
  if(dy <= 0 || dy + dh >= H) return true;
  for(let p of pipes){
    let px = p.x, pw = PIPE_W;
    let inX = dx + dw - margin > px + margin && dx + margin < px + pw - margin;
    if(inX){
      if(dy + margin < p.topH || dy + dh - margin > p.bottomY) return true;
    }
  }
  return false;
}

// ---- DRAW FUNCTIONS ----

function drawBackground(){
  if(phase===1){
    // Habitación - warm walls
    let gr = ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#f5deb3'); gr.addColorStop(1,'#deb887');
    ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
    // floor
    ctx.fillStyle='#8B4513'; ctx.fillRect(0,H-60,W,60);
    // floor shine
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(0,H-60,W,10);
  } else if(phase===2){
    // Baño - tile blue/white
    let gr = ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#e0f2fe'); gr.addColorStop(1,'#bae6fd');
    ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
    // tiles
    ctx.strokeStyle='rgba(100,180,255,0.3)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=30){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=30){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.fillStyle='#6B8E7F'; ctx.fillRect(0,H-60,W,60);
  } else if(phase===3){
    // Jardín - sky + grass
    let sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#87CEEB'); sky.addColorStop(0.7,'#a8edea'); sky.addColorStop(1,'#56ab2f');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#56ab2f'; ctx.fillRect(0,H-70,W,70);
    ctx.fillStyle='#4CAF50'; ctx.fillRect(0,H-75,W,10);
  } else if(phase===4){
    // Carretera - city dusk
    let sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0d0d2b'); sky.addColorStop(0.5,'#1a1a4e'); sky.addColorStop(1,'#2d2d6b');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for(let s of stars){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
  } else if(phase===5){
    // Fast food - inside restaurant
    let gr = ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#ff6b6b'); gr.addColorStop(0.5,'#feca57'); gr.addColorStop(1,'#ff9f43');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
}

function drawBgObjects(){
  for(let o of bgObjects){
    if(o.type==='window'){
      ctx.fillStyle='#87CEEB'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.strokeStyle='#8B6914'; ctx.lineWidth=4; ctx.strokeRect(o.x,o.y,o.w,o.h);
      ctx.strokeStyle='rgba(100,150,200,0.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w/2,o.y+o.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h/2); ctx.lineTo(o.x+o.w,o.y+o.h/2); ctx.stroke();
    } else if(o.type==='picture'){
      ctx.fillStyle='#8B4513'; ctx.fillRect(o.x-4,o.y-4,o.w+8,o.h+8);
      ctx.fillStyle='#fff'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#3498db'; ctx.fillRect(o.x+8,o.y+8,o.w-16,o.h-16);
    } else if(o.type==='sofa'){
      ctx.fillStyle='#8B0000'; ctx.fillRect(o.x,o.y+20,o.w,o.h-20);
      ctx.fillStyle='#a00'; ctx.fillRect(o.x,o.y,o.w,28);
      ctx.fillStyle='#900'; ctx.fillRect(o.x-10,o.y+10,16,o.h-10); ctx.fillRect(o.x+o.w-6,o.y+10,16,o.h-10);
    } else if(o.type==='tv'){
      ctx.fillStyle='#222'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#111'; ctx.fillRect(o.x+5,o.y+5,o.w-10,o.h-20);
      ctx.fillStyle='rgba(100,220,255,0.3)'; ctx.fillRect(o.x+5,o.y+5,o.w-10,o.h-20);
      ctx.fillStyle='#333'; ctx.fillRect(o.x+o.w/2-3,o.y+o.h,6,20);
      ctx.fillRect(o.x+10,o.y+o.h+20,o.w-20,6);
    } else if(o.type==='toilet'){
      ctx.fillStyle='#e8e8e8';
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h-20,o.w/2,22,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(o.x+10,o.y,o.w-20,o.h-20);
      ctx.fillStyle='#ccc'; ctx.fillRect(o.x+5,o.y-12,o.w-10,16);
      ctx.strokeStyle='#bbb'; ctx.lineWidth=2; ctx.strokeRect(o.x+5,o.y-12,o.w-10,16);
    } else if(o.type==='sink'){
      ctx.fillStyle='#f0f0f0';
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+30,o.w/2-5,22,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(o.x,o.y+20,o.w,12); ctx.fillRect(o.x,o.y+50,o.w,10);
      ctx.fillStyle='#ccc'; ctx.fillRect(o.x+o.w/2-3,o.y+35,6,30);
    } else if(o.type==='mirror'){
      ctx.fillStyle='rgba(150,220,255,0.3)';
      ctx.strokeStyle='#ccc'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,8); ctx.fill(); ctx.stroke();
    } else if(o.type==='tree'){
      // trunk
      ctx.fillStyle='#8B4513'; ctx.fillRect(o.x+o.w/2-6,o.y+o.h-40,12,40);
      // leaves
      ctx.fillStyle='#2d8a4e';
      ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y); ctx.lineTo(o.x,o.y+o.h*0.5); ctx.lineTo(o.x+o.w,o.y+o.h*0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#3aa85e';
      ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y+20); ctx.lineTo(o.x-5,o.y+o.h*0.7); ctx.lineTo(o.x+o.w+5,o.y+o.h*0.7); ctx.closePath(); ctx.fill();
    } else if(o.type==='bush'){
      ctx.fillStyle='#2e7d32';
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#388e3c';
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2-10,o.y+o.h/2+5,o.w/3,o.h/3,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2+10,o.y+o.h/2+5,o.w/3,o.h/3,0,0,Math.PI*2); ctx.fill();
    } else if(o.type==='sun'){
      ctx.fillStyle='rgba(255,220,0,0.3)';
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r+15,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFD700';
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,220,0,0.5)'; ctx.lineWidth=3;
      for(let i=0;i<8;i++){
        let a=i*Math.PI/4, r=o.r+8;
        ctx.beginPath(); ctx.moveTo(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r); ctx.lineTo(o.x+Math.cos(a)*(r+12),o.y+Math.sin(a)*(r+12)); ctx.stroke();
      }
    } else if(o.type==='cloud'){
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o.x+20,o.y+o.h/2+5,o.w/3,o.h/2-5,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o.x+o.w-15,o.y+o.h/2+5,o.w/3,o.h/2-5,0,0,Math.PI*2); ctx.fill();
    } else if(o.type==='road'){
      ctx.fillStyle='#555'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#777'; ctx.fillRect(o.x,o.y,o.w,8);
    } else if(o.type==='building'){
      ctx.fillStyle='#1a1a3e';
      ctx.fillRect(o.x,o.y,o.w,H-80-o.y);
      // windows
      ctx.fillStyle='rgba(255,220,80,0.6)';
      for(let wy=o.y+10;wy<H-100;wy+=20) for(let wx=o.x+6;wx<o.x+o.w-12;wx+=18){
        if(Math.random()>0.3) ctx.fillRect(wx,wy,10,10);
      }
    } else if(o.type==='car'){
      ctx.fillStyle=o.color; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#87CEEB'; ctx.fillRect(o.x+8,o.y-14,o.w-20,16);
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(o.x+16,o.y+o.h,10,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.x+o.w-16,o.y+o.h,10,0,Math.PI*2); ctx.fill();
    } else if(o.type==='stripe'){
      ctx.fillStyle='#fff'; ctx.fillRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='counter'){
      ctx.fillStyle='#c0392b'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#e74c3c'; ctx.fillRect(o.x,o.y,o.w,10);
    } else if(o.type==='floor'){
      ctx.fillStyle=o.color||'#8B4513'; ctx.fillRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='burger'){
      let bx=o.x, by=o.y, s=o.size;
      ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.ellipse(bx,by,s,s*0.4,0,Math.PI,0); ctx.fill();
      ctx.fillStyle='#f39c12'; ctx.fillRect(bx-s+2,by,s*2-4,s*0.3);
      ctx.fillStyle='#27ae60'; ctx.fillRect(bx-s+5,by+s*0.3,s*2-10,s*0.25);
      ctx.fillStyle='#e67e22'; ctx.fillRect(bx-s+2,by+s*0.5,s*2-4,s*0.3);
      ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.ellipse(bx,by+s*0.85,s,s*0.4,0,0,Math.PI); ctx.fill();
    } else if(o.type==='lamp'){
      ctx.fillStyle='rgba(255,220,50,0.15)';
      ctx.beginPath(); ctx.arc(o.x+o.w/2,o.y+o.h,40,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#666'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(o.x+o.w/2,o.y+o.h,10,0,Math.PI*2); ctx.fill();
    } else if(o.type==='sign'){
      ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,10); ctx.fill();
      ctx.strokeStyle='#f39c12'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,10); ctx.stroke();
      ctx.fillStyle='white'; ctx.font='bold 14px Fredoka One, sans-serif'; ctx.textAlign='center';
      ctx.fillText(o.text, o.x+o.w/2, o.y+o.h/2+6);
    }
  }
}

function getPipeColor(){
  const colors = ['#8B4513','#4fc3f7','#66BB6A','#ef5350','#FF9800'];
  return colors[(phase-1)] || '#4CAF50';
}

function drawPipes(){
  let col = getPipeColor();
  let darkCol = shadeColor(col, -30);
  for(let p of pipes){
    // Top pipe
    drawPipe(p.x, 0, PIPE_W, p.topH, col, darkCol, true);
    // Bottom pipe
    drawPipe(p.x, p.bottomY, PIPE_W, H-p.bottomY, col, darkCol, false);
  }
}

function drawPipe(x, y, w, h, col, dark, isTop){
  // Main body
  let gr = ctx.createLinearGradient(x,0,x+w,0);
  gr.addColorStop(0, shadeColor(col,20));
  gr.addColorStop(0.5, col);
  gr.addColorStop(1, dark);
  ctx.fillStyle = gr;
  ctx.fillRect(x, y, w, h);
  // Cap
  let capH = 20, capW = w+14;
  ctx.fillStyle = dark;
  if(isTop) ctx.fillRect(x-7, y+h-capH, capW, capH);
  else ctx.fillRect(x-7, y, capW, capH);
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(x+4, y, 8, h);
}

function shadeColor(hex, pct){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.max(0,r+pct)); g=Math.min(255,Math.max(0,g+pct)); b=Math.min(255,Math.max(0,b+pct));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// --- DRAW DANIEL ---
function drawDaniel(){
  ctx.save();
  ctx.translate(DANIEL.x + DANIEL.w/2, DANIEL.y + DANIEL.h/2);
  DANIEL.rotation = Math.max(-0.4, Math.min(0.5, DANIEL.vy * 0.04));
  ctx.rotate(DANIEL.rotation);

  let hw = DANIEL.w/2, hh = DANIEL.h/2;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(3,hh+4,hw*0.8,8,0,0,Math.PI*2); ctx.fill();

  // Legs
  ctx.fillStyle='#2c3e50';
  ctx.fillRect(-hw+6, hh-18, 12, 20);
  ctx.fillRect(hw-18, hh-18, 12, 20);
  // Shoes
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-hw+12,hh+4,10,6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hw-12,hh+4,10,6,0,0,Math.PI*2); ctx.fill();

  // Torso (big belly!)
  ctx.fillStyle='#e74c3c'; // red shirt
  ctx.beginPath(); ctx.ellipse(0, 4, hw, hh*0.7, 0, 0, Math.PI*2); ctx.fill();
  // Belly button area
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(2,10,8,6,0,0,Math.PI*2); ctx.fill();

  // Arms
  ctx.fillStyle='#f39c12'; // skin
  ctx.fillRect(-hw-8, -4, 12, 10); // left arm
  ctx.fillRect(hw-4, -4, 12, 10);  // right arm

  // Neck
  ctx.fillStyle='#f39c12';
  ctx.fillRect(-8,-hh+8,16,16);

  // Head
  ctx.fillStyle='#f39c12';
  ctx.beginPath(); ctx.ellipse(0, -hh+2, 20, 22, 0, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle='#6B3A2A';
  ctx.beginPath(); ctx.ellipse(0,-hh-10,20,12,0,0,Math.PI*2); ctx.fill();
  // Hair strands
  ctx.fillStyle='#5a3020';
  for(let i=-2;i<=2;i++) { ctx.fillRect(i*6-2, -hh-18, 4, 10); }

  // Eyes
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.ellipse(-7,-hh+4,6,7,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-hh+4,6,7,0,0,Math.PI*2); ctx.fill();
  // Pupils
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.ellipse(-6,-hh+4,3,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-hh+4,3,4,0,0,Math.PI*2); ctx.fill();
  // Shine
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(-5,-hh+2,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9,-hh+2,1.5,0,Math.PI*2); ctx.fill();

  // Cheeks
  ctx.fillStyle='rgba(255,100,100,0.3)';
  ctx.beginPath(); ctx.ellipse(-13,-hh+8,5,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13,-hh+8,5,4,0,0,Math.PI*2); ctx.fill();

  // Mouth (smile or scared)
  ctx.strokeStyle='#333'; ctx.lineWidth=2;
  if(DANIEL.vy < -4){
    // scared O mouth
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.ellipse(0,-hh+14,4,5,0,0,Math.PI*2); ctx.fill();
  } else {
    // smile
    ctx.beginPath();
    ctx.arc(0,-hh+15,6,0.2,Math.PI-0.2); ctx.stroke();
  }

  // Pants
  ctx.fillStyle='#2c3e50';
  ctx.fillRect(-hw+4,hh*0.2,DANIEL.w-8,18);

  ctx.restore();

  // Fart clouds
  for(let fc of DANIEL.fartClouds){
    ctx.save();
    ctx.globalAlpha = fc.life * 0.75;
    let grd = ctx.createRadialGradient(fc.x,fc.y,0,fc.x,fc.y,20);
    grd.addColorStop(0,'rgba(180,220,80,0.8)');
    grd.addColorStop(1,'rgba(100,180,50,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(fc.x,fc.y,18*(1-fc.life*0.3)+5,0,Math.PI*2); ctx.fill();
    // small puff circles
    ctx.fillStyle=`rgba(160,210,60,${fc.life*0.6})`;
    ctx.beginPath(); ctx.arc(fc.x-8,fc.y+6,8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(fc.x+6,fc.y+8,6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(let p of particles){
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// -- WIN SCREEN on canvas (animated) --
let winAnim = 0;
function drawWinCanvas(){
  winAnim += 0.03;
  ctx.clearRect(0,0,W,H);
  let gr = ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#11998e'); gr.addColorStop(1,'#38ef7d');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);

  // Confetti
  for(let i=0;i<40;i++){
    let x=(i*73+winAnim*60)%W, y=(i*97+winAnim*40*(i%2?1:-1))%H;
    ctx.fillStyle=['#ff6b6b','#feca57','#a29bfe','#fd79a8','#74b9ff'][i%5];
    ctx.fillRect(x,y,8,8);
  }

  // Big burger plate
  ctx.save();
  ctx.translate(W/2, H/2-20+Math.sin(winAnim*2)*8);
  ctx.font='80px serif'; ctx.textAlign='center'; ctx.fillText('🍔',0,0);
  ctx.font='40px serif'; ctx.fillText('🏆',-45,-50);
  ctx.font='40px serif'; ctx.fillText('🎉',45,-50);
  ctx.restore();

  requestAnimationFrame(()=>{ if(state==='win') drawWinCanvas(); });
}

// --- UPDATE ---
function update(){
  frameCount++;

  // Physics
  DANIEL.vy += DANIEL.gravity;
  DANIEL.y += DANIEL.vy;

  // Fart clouds update
  DANIEL.fartClouds = DANIEL.fartClouds.filter(fc=>{
    fc.x += fc.vx; fc.y += fc.vy; fc.life -= 0.045;
    return fc.life > 0;
  });

  // Particles
  particles = particles.filter(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.05;
    return p.life > 0;
  });

  // Pipes
  pipeTimer++;
  if(pipeTimer >= pipeInterval){ pipeTimer=0; spawnPipe(); }
  pipes = pipes.filter(p=>{
    p.x -= pipeSpeed;
    if(!p.scored && p.x + PIPE_W < DANIEL.x){
      p.scored = true;
      score++;
      spawnScoreParticle(DANIEL.x + DANIEL.w, DANIEL.y);
      document.getElementById('scoreDisplay').textContent = score;
      updatePhase();
      if(score >= 50){ showWin(); drawWinCanvas(); return false; }
    }
    return p.x + PIPE_W > -20;
  });

  if(checkCollision()){ showGameOver(); }
}

// --- LOOP ---
function loop(){
  if(state !== 'playing') return;
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawBgObjects();
  drawPipes();
  drawDaniel();
  drawParticles();
  update();
  requestAnimationFrame(loop);
}

// --- START ---
showMenu();
// Animate menu canvas
function menuLoop(){
  if(state !== 'menu') return;
  ctx.clearRect(0,0,W,H);
  let gr = ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#ff6b35'); gr.addColorStop(0.5,'#f7931e'); gr.addColorStop(1,'#ffcd3c');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  // Floating emojis
  let t = Date.now()/1000;
  ctx.font='30px serif'; ctx.globalAlpha=0.2;
  for(let i=0;i<8;i++){
    ctx.fillText('💨', 20+i*52, 100+(Math.sin(t+i)*40));
    ctx.fillText('🍔', 30+i*48, 300+(Math.cos(t*0.7+i)*35));
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(menuLoop);
}
menuLoop();
